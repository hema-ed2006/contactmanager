{% extends "base.html" %}

{% block content %}

<h3>Add Contact</h3>

<form method="post">
    <div class="mb-3">
        <label>Name</label>
        <input type="text" name="name" class="form-control" required>
    </div>

    <div class="mb-3">
        <label>Phone</label>
        <input type="text" name="phone" class="form-control" required>
    </div>

    <button class="btn btn-success">Add Contact</button>
</form>

<hr>

<h3>Contact List</h3>

<table class="table table-bordered">
    <tr>
        <th>Name</th>
        <th>Phone</th>
    </tr>

    {% for c in contacts %}
    <tr>
        <td>{{ c.name }}</td>
        <td>{{ c.phone }}</td>
    </tr>
    {% endfor %}
</table>

{% endblock %}
